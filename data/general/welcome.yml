flows:
  welcome:
    if: False
    description: |
      This flow is designed to greet and onboard new users who initiate a welcome intent.
      It begins with an initial greeting message to establish a friendly interaction.
    name: say hello
    run_pattern_completed: false
    steps:
      - action: utter_greeting
      - noop: true
        next:
          - if: slots.requested_action == "fishing_tips"
            then: go_to_fishing_tips
          - else: END
      - id: go_to_fishing_tips
        link: fishing_tips
