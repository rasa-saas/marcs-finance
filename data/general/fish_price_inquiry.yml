flows:
  fish_price_inquiry:
    description: |
      Handles inquiries about fish market prices. The LLM recognizes when a user
      is asking about fish prices and responds with an on-brand, playful message
      that redirects them to their local fish monger. This flow embraces the
      Trout Bank's fishing theme while making it clear we're a bank, not a fish market.
    name: fish_price_inquiry
    steps:
      - action: utter_not_a_fish_monger
