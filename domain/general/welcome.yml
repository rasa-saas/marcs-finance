version: "3.1"

slots:
  bank_name:
    type: text
    initial_value: "Trout"
    mappings:
      - type: controlled
  skills_summary:
    type: text
    initial_value: "casting transfers, managing your favorite fishing buddies (payees), checking your net worth, locking down your fishing cards, and answering all your fin-ancial questions"
    mappings:
      - type: controlled
  example_questions:
    type: text
    initial_value: |
      - What's my net worth today?
      - Send $50 to my fishing buddy Alice.
      - Lock my fishing card for now.
      - Download my latest statement to see where the money went.
    mappings:
      - type: controlled
  agent_name:
    type: text
    initial_value: "Reel"
    mappings:
      - type: controlled

responses:
  utter_greeting:
    - text: "Hey there! 🎣 I'm {agent_name}, your AI agent at {bank_name}—the world's first fishing-focused bank! I'm here to help with {skills_summary}. \n Here's a few things you can ask me: {example_questions} \n So, what can I help you with today? 😎"
      metadata:
        rephrase: True
    - text: "What's up! I'm {agent_name}, an AI assistant at {bank_name}. I'm your go-to fin-pal for {skills_summary}. What would you like to do?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_hello:
    - text: "Ahoy! 🎣 Great to see you. I'm {agent_name}, your AI agent, and I'm stoked to help with your {bank_name} account. What do you need today?"
      metadata:
        rephrase: True
    - text: "Hey! Welcome to {bank_name}—I'm {agent_name}, an AI helping you bank as chill as a day on the water. How can I help?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_help:
    - text: "I can help you with {skills_summary}. \n\n Here's a few things you can ask me: \n {example_questions}\n What can I help you with?"
    - text: "I can transfer money, check your balance, block a card, or answer general finance questions. What can I help you with?"
      metadata:
        rephrase: True
      channel: "browser_audio"
