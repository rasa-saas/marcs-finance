version: "3.1"

slots:
  bank_name:
    type: text
    initial_value: "Trout"
    mappings:
      - type: controlled
  skills_summary:
    type: text
    initial_value: "casting transfers, managing your favorite fishing buddies (payees), checking your net worth, locking down your fishing cards, and answering all your fin-ancial questions"
    mappings:
      - type: controlled
  example_questions:
    type: text
    initial_value: |
      - What's my net worth today?
      - Send $50 to my fishing buddy Alice.
      - Lock my fishing card for now.
      - Download my latest statement to see where the money went.
    mappings:
      - type: controlled
  agent_name:
    type: text
    initial_value: "Finn"
    mappings:
      - type: controlled

responses:
  utter_greeting:
    - text: "Hey there! 🎣 I'm {agent_name} from {bank_name}—the world's first fishing-focused bank! I'm here to help with {skills_summary}. \n Here's a few things you can ask me: {example_questions} \n So, what can I help you with today? 😎"
      metadata:
        rephrase: True
    - text: "What's up! I'm {agent_name} at {bank_name}. I'm your go-to fin-pal for {skills_summary}. What would you like to do?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_hello:
    - text: "Ahoy! 🎣 Great to see you. I'm {agent_name}, and I'm stoked to help with your {bank_name} account. What do you need today?"
      metadata:
        rephrase: True
    - text: "Hey! Welcome to {bank_name}—where we make banking as chill as a day on the water. How can I help?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_help:
    - text: "You've come to the right place, friend! 🎣 I can help with {skills_summary}. \n\n Here's a few things you can cast my way: \n {example_questions}\n What'll it be?"
    - text: "No problem! I'm here to help with transfers, checking your net worth, managing payees, locking cards, and fin-ancial questions. What's on your mind?"
      metadata:
        rephrase: True
      channel: "browser_audio"
