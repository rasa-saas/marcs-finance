version: "3.1"

slots:
  bank_name:
    type: text
    initial_value: "Trout"
    mappings:
      - type: controlled
  skills_summary:
    type: text
    initial_value: "casting transfers, managing your favorite fishing buddies (payees), checking your net worth, locking down your fishing cards, and answering all your fin-ancial questions"
    mappings:
      - type: controlled
  example_questions:
    type: text
    initial_value: |
      - What's my net worth today?
      - Send $50 to my fishing buddy Alice.
      - Lock my fishing card for now.
      - Download my latest statement to see where the money went.
    mappings:
      - type: controlled
  agent_name:
    type: text
    initial_value: "Reel"
    mappings:
      - type: controlled

responses:
  utter_greeting:
    - text: "🎣 I'm {agent_name}, an AI at {bank_name}. I do {skills_summary}. What do you need?"
      buttons:
        - payload: "/SetSlots(requested_action=banking_help)"
          title: "Banking Help"
        - payload: "/SetSlots(requested_action=fishing_tips)"
          title: "Fishing Tips"
        - payload: "/SetSlots(requested_action=other)"
          title: "Something Else"
      metadata:
        rephrase: True
    - text: "Reel here. I handle {skills_summary}. What's next?"
      buttons:
        - payload: "/SetSlots(requested_action=banking_help)"
          title: "Banking Help"
        - payload: "/SetSlots(requested_action=fishing_tips)"
          title: "Fishing Tips"
        - payload: "/SetSlots(requested_action=other)"
          title: "Something Else"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_hello:
    - text: "🎣 {agent_name} here. Ready to help with your {bank_name} account. What's the move?"
      metadata:
        rephrase: True
    - text: "I'm {agent_name}. Let's handle your banking. What do you need?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_help:
    - text: "I can {skills_summary}. \n\nExamples: {example_questions}\n\nWhat's it gonna be?"
    - text: "Transfers, balance checks, card management, payees, fin-ancial questions. Pick one."
      metadata:
        rephrase: True
      channel: "browser_audio"
